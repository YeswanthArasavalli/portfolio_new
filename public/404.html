<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yeswanth Arasavalli | Portfolio</title>
    <meta name="robots" content="noindex" />

    <script>
      // GitHub Pages serves this file for any path without a matching static
      // file (e.g. a page refresh on /projects or /experience). Forward the
      // requested path to the SPA entry point; index.html restores the URL
      // with history.replaceState before React Router reads the location.
      (function () {
        var path = window.location.pathname.replace(/^\/+/, "");
        if (path) {
          window.location.replace("/?r=" + encodeURIComponent(path) + window.location.hash);
        } else {
          window.location.replace("/");
        }
      })();
    </script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans",
          "Helvetica Neue", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        max-width: 420px;
        padding: 1rem;
      }
      p {
        color: #9ca3af;
        margin-bottom: 1.5rem;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <p>Redirecting…</p>
      <a href="/">Go to yeswantharasavalli.me</a>
    </div>
  </body>
</html>
